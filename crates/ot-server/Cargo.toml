[package]
name = "opentally"
description = "Local accounting and reconciliation backed by DuckDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opentally"
path = "src/main.rs"

[features]
default = ["bundled-duckdb"]
bundled-duckdb = ["ot-store/bundled-duckdb"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
argon2 = { version = "0.5", features = ["std"] }
axum.workspace = true
getrandom = "0.3"
ot-api-types = { path = "../ot-api-types" }
ot-core = { path = "../ot-core" }
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }
ot-store = { path = "../ot-store", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["io-std", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
tower = { version = "0.5", features = ["util"] }
