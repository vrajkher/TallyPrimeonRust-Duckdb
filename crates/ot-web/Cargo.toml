[package]
name = "ot-web"
description = "OpenTally's browser interface, built with Leptos and compiled to WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8.23", features = ["csr"] }
ot-api-types = { path = "../ot-api-types" }
serde.workspace = true
serde_json.workspace = true
web-sys = { version = "0.3", features = ["HtmlDocument", "HtmlElement", "KeyboardEvent", "Location", "Window"] }
