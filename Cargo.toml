[workspace]
resolver = "3"
members = ["crates/ot-core", "crates/ot-store", "crates/ot-server"]
default-members = ["crates/ot-server", "crates/ot-store", "crates/ot-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.4"
duckdb = "=1.4.4"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = "1"
